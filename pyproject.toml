[project]
name = "enterprise-info-collector"
version = "0.1.0"
description = "企业信息收集系统"
requires-python = ">=3.10"

dependencies = [
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0"]